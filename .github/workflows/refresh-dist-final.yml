name: Refresh dist 0.1.1 final

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test final package
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y busybox
          make all
      - name: Publish committed package
        shell: bash
        run: |
          set -euo pipefail
          rm -f dist/opkg-rewind_*_all.ipk dist/SHA256SUMS
          cp build/opkg-rewind_0.1.1-1_all.ipk dist/
          (cd dist && sha256sum opkg-rewind_0.1.1-1_all.ipk > SHA256SUMS)
          rm -f .github/workflows/refresh-dist-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: refresh final 0.1.1-1 package"
          git push
