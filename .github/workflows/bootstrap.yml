name: Bootstrap repository

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize source and build package
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .bootstrap/rewind.gz.b64 ]]; then
            echo "Bootstrap payload already consumed."
            exit 0
          fi
          mkdir -p src tests dist
          base64 -d .bootstrap/rewind.gz.b64 | gzip -dc > src/rewind
          base64 -d .bootstrap/tests.gz.b64 | gzip -dc > tests/run.sh
          curl -fsSL https://raw.githubusercontent.com/spdx/license-list-data/main/text/GPL-3.0-or-later.txt -o LICENSE
          chmod 0755 src/rewind tests/run.sh
          sh -n src/rewind
          sh tests/run.sh
          make ipk
          cp build/opkg-rewind_0.1.0-1_all.ipk dist/
          (cd dist && sha256sum opkg-rewind_0.1.0-1_all.ipk > SHA256SUMS)
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: materialize OPKG Rewind source and package"
          git push
