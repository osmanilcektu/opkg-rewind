# OPKG Rewind runtime policy.
# Values are intentionally simple KEY=value pairs; this file is not sourced as shell code.

# Number of rollback snapshots retained. History metadata is retained separately.
KEEP_TRANSACTIONS=3

# Refuse a transaction when the estimated rollback snapshot exceeds this many KB.
MAX_SNAPSHOT_KB=32768

# Refuse/start rollback snapshotting if free space would fall below this many KB.
MIN_FREE_KB=8192

# 1 = rollback automatically when opkg or post-transaction health checks fail.
AUTO_ROLLBACK=1

# Keep this 0. Core upgrades/removals require an explicit --allow-core.
ALLOW_CORE_DEFAULT=0
